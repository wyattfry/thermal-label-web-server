<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Print Preview</title>
    <style>
      :root {
        --bg: #f7f5f2;
        --card: #ffffff;
        --text: #1f1f1f;
        --muted: #6b6b6b;
        --accent: #1e88e5;
        --border: #d8d5d0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
      .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; gap: 18px; }
      h1 { margin: 0; font-size: 24px; text-align: center; }
      .panel { width: min(960px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); display: grid; gap: 18px; }
      .controls-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: start; }
      .control-form { display: grid; gap: 12px; }
      .btn { display: inline-flex; justify-content: center; align-items: center; padding: 14px; border-radius: 12px; border: 1px solid transparent; font-size: 15px; cursor: pointer; transition: transform 0.08s ease; }
      .btn.primary { background: var(--accent); color: #fff; }
      .btn.secondary { background: #efede9; color: var(--text); border-color: var(--border); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      input[type=file] { display: none; }
      .hint { margin: 0; font-size: 13px; color: var(--muted); }
      details { border-top: 1px solid var(--border); padding-top: 12px; }
      summary { cursor: pointer; font-weight: 600; }
      label { font-size: 13px; color: var(--muted); }
      select { width: 100%; padding: 8px 10px; font-size: 14px; border-radius: 8px; border: 1px solid var(--border); }
      .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .preview-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: start; }
      .label { height: min(70vh, 520px); width: auto; aspect-ratio: 2 / 3; background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; padding: 8px; margin: 0 auto; }
      .label img { max-width: 100%; max-height: 100%; object-fit: contain; }
      .file-actions { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
      .file-actions a { padding: 6px 10px; background: #f2f2f2; color: #222; text-decoration: none; font-size: 13px; border-radius: 8px; }
      .debug { margin-top: 6px; font-size: 12px; color: #555; text-align: center; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      .debug a { color: #333; text-decoration: none; background: #f6f6f6; padding: 4px 6px; border-radius: 6px; }
      .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(31, 31, 31, 0.6); color: #fff; font-size: 16px; }
      .overlay.show { display: flex; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Thermal Label Printer</h1>
      <div class="panel">
        <div class="controls-row">
          <form id="uploadForm" class="control-form" method="post" action="/print" enctype="multipart/form-data">
            <input type="hidden" name="action" id="action" value="preview" />
            <input id="file" type="file" name="file" required />
            <label class="btn secondary" for="file">Upload New File</label>
            <p class="hint">Accepted: PDF, PNG, JPG, JPEG, TIFF, BMP, GIF</p>
            <details>
              <summary>Advanced</summary>
              <div class="control-form" style="margin-top: 12px;">
                <div>
                  <label for="mode">Image mode</label>
                  <select id="mode" name="mode">
                    <option value="auto_detect" selected>Auto detect (crop label, auto-rotate)</option>
                    <option value="crop_center">Crop center to fill 4x6</option>
                    <option value="crop_top">Crop top (label near top)</option>
                    <option value="stretch">Stretch to fill 4x6</option>
                    <option value="fit">Fit with margins</option>
                  </select>
                </div>
                <div>
                  <label for="rotate">Rotate</label>
                  <select id="rotate" name="rotate">
                    <option value="0">0 deg</option>
                    <option value="90">90 deg</option>
                    <option value="180">180 deg</option>
                    <option value="270">270 deg</option>
                  </select>
                </div>
              </div>
              <div class="checkbox" style="margin-top: 10px;">
                <input id="debug" type="checkbox" name="debug" value="1" />
                <label for="debug">Save auto-detect debug images</label>
              </div>
            </details>
          </form>

          <form id="printForm" class="control-form" method="post" action="/print-processed">
            {% for f in files %}
            <input type="hidden" name="files" value="{{ f }}" />
            {% endfor %}
            <button class="btn primary" type="submit">Print</button>
          </form>
        </div>

        <div class="preview-grid">
          {% for f in files %}
            <div>
              <div class="label">
                <img src="{{ url_for('files', filename=f) }}" alt="Preview {{ loop.index }}" />
              </div>
              <div class="file-actions">
                <a href="{{ url_for('edit_file', filename=f) }}">Edit crop/rotate</a>
              </div>
              {% if debug_files.get(f) %}
                <div class="debug">
                  {% for d in debug_files.get(f) %}
                    <a href="{{ url_for('files', filename=d) }}">{{ d }}</a>
                  {% endfor %}
                </div>
              {% endif %}
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
    <div class="overlay" id="overlay">Printing...</div>
    <script>
      const fileInput = document.getElementById('file');
      const uploadForm = document.getElementById('uploadForm');
      const actionField = document.getElementById('action');
      const overlay = document.getElementById('overlay');
      const printForm = document.getElementById('printForm');

      fileInput.addEventListener('change', () => {
        if (!fileInput.files.length) {
          return;
        }
        actionField.value = 'preview';
        uploadForm.submit();
      });

      printForm.addEventListener('submit', () => {
        overlay.classList.add('show');
        printForm.querySelector('button').disabled = true;
      });
    </script>
  </body>
</html>
