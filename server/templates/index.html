<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermal Label Printer</title>
    <style>
      :root {
        --bg: #f7f5f2;
        --card: #ffffff;
        --text: #1f1f1f;
        --muted: #6b6b6b;
        --accent: #1e88e5;
        --border: #d8d5d0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
      .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 20px; gap: 24px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; text-align: center; }
      .panel { width: min(860px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08); }
      form { display: grid; gap: 14px; }
      .controls { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: center; }
      .btn { display: inline-flex; justify-content: center; align-items: center; padding: 16px; border-radius: 12px; border: 1px solid transparent; font-size: 16px; cursor: pointer; transition: transform 0.08s ease, box-shadow 0.08s ease; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
      .btn.primary { background: var(--accent); color: #fff; }
      .btn.secondary { background: #efede9; color: var(--text); border-color: var(--border); }
      .btn:active { transform: translateY(1px); }
      input[type=file] { display: none; }
      .hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
      details { border-top: 1px solid var(--border); padding-top: 12px; }
      summary { cursor: pointer; font-weight: 600; }
      label { font-size: 13px; color: var(--muted); }
      select { width: 100%; padding: 8px 10px; font-size: 14px; border-radius: 8px; border: 1px solid var(--border); }
      .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .status { margin-top: 12px; padding: 10px 12px; background: #efece6; border-radius: 10px; font-size: 14px; text-align: center; }
      .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #262626; color: #fff; padding: 10px 14px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      .toast.show { opacity: 1; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(31, 31, 31, 0.45); display: none; align-items: center; justify-content: center; padding: 20px; }
      .modal-backdrop.show { display: flex; }
      .modal { width: min(560px, 100%); background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 18px; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.18); display: grid; gap: 14px; }
      .modal h2 { margin: 0; font-size: 22px; }
      .modal textarea { width: 100%; min-height: 220px; resize: vertical; padding: 12px; border-radius: 12px; border: 1px solid var(--border); font: 700 28px Arial, sans-serif; color: var(--text); }
      .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Thermal Label Printer</h1>
      <div class="panel">
        <form id="uploadForm" method="post" action="/print" enctype="multipart/form-data">
          <input type="hidden" name="action" id="action" value="preview" />
          <input id="file" type="file" name="file" required />
          <div class="controls">
            <button class="btn secondary" type="button" id="openTextBtn">Enter Text</button>
            <label class="btn secondary" for="file">Upload PDF</label>
            <button class="btn primary" type="submit" id="printBtn" disabled>Print</button>
          </div>
          <p class="hint">Accepted: PDF, PNG, JPG, JPEG, TIFF, BMP, GIF</p>
          <details>
            <summary>Advanced</summary>
            <div class="controls" style="margin-top: 12px;">
              <div>
                <label for="mode">Image mode</label>
                <select id="mode" name="mode">
                  <option value="auto_detect" selected>Auto detect (crop label, auto-rotate)</option>
                  <option value="crop_center">Crop center to fill 4x6</option>
                  <option value="crop_top">Crop top (label near top)</option>
                  <option value="stretch">Stretch to fill 4x6</option>
                  <option value="fit">Fit with margins</option>
                </select>
              </div>
              <div>
                <label for="rotate">Rotate</label>
                <select id="rotate" name="rotate">
                  <option value="0">0 deg</option>
                  <option value="90">90 deg</option>
                  <option value="180">180 deg</option>
                  <option value="270">270 deg</option>
                </select>
              </div>
            </div>
            <div class="checkbox" style="margin-top: 10px;">
              <input id="debug" type="checkbox" name="debug" value="1" />
              <label for="debug">Save auto-detect debug images</label>
            </div>
          </details>
        </form>
        {% if message %}
        <div class="status">{{ message }}</div>
        {% endif %}
      </div>
    </div>
    <div class="toast" id="toast">{{ message or '' }}</div>
    <div class="modal-backdrop" id="textModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
        <h2 id="textModalTitle">Enter Label Text</h2>
        <form method="post" action="/preview-text" id="textForm">
          <label for="labelText">Text</label>
          <textarea id="labelText" name="text" placeholder="Storage A&#10;Shelf 4">{{ initial_text or '' }}</textarea>
          <div class="modal-actions">
            <button class="btn secondary" type="button" id="cancelTextBtn">Cancel</button>
            <button class="btn primary" type="submit">OK</button>
          </div>
        </form>
      </div>
    </div>
    <script>
      const fileInput = document.getElementById('file');
      const uploadForm = document.getElementById('uploadForm');
      const actionField = document.getElementById('action');
      const printBtn = document.getElementById('printBtn');
      const toast = document.getElementById('toast');
      const openTextBtn = document.getElementById('openTextBtn');
      const cancelTextBtn = document.getElementById('cancelTextBtn');
      const textModal = document.getElementById('textModal');
      const labelText = document.getElementById('labelText');

      function closeTextModal() {
        textModal.classList.remove('show');
        textModal.setAttribute('aria-hidden', 'true');
      }

      function openTextModal() {
        textModal.classList.add('show');
        textModal.setAttribute('aria-hidden', 'false');
        labelText.focus();
        labelText.select();
      }

      fileInput.addEventListener('change', () => {
        if (!fileInput.files.length) {
          return;
        }
        actionField.value = 'preview';
        uploadForm.submit();
      });

      printBtn.addEventListener('click', () => {
        actionField.value = 'print';
      });

      openTextBtn.addEventListener('click', openTextModal);
      cancelTextBtn.addEventListener('click', closeTextModal);
      textModal.addEventListener('click', (event) => {
        if (event.target === textModal) {
          closeTextModal();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeTextModal();
        }
      });

      if (toast.textContent.trim()) {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }
    </script>
  </body>
</html>
